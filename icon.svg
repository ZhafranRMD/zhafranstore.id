<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#neonCyan)" stroke-width="6" stroke-opacity="0.5" />

  <!-- Outer Cyber Circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#neonPurple)" stroke-width="4" stroke-dasharray="14 10" stroke-opacity="0.4" />

  <!-- Glowing Gamepad Body -->
  <path d="M150 180 C110 180 85 225 85 285 C85 345 115 375 145 375 C175 375 195 335 220 335 L292 335 C317 335 337 375 367 375 C397 375 427 345 427 285 C427 225 402 180 362 180 Z" 
        fill="#111827" 
        stroke="url(#neonCyan)" 
        stroke-width="12" 
        filter="url(#glow)" />

  <!-- D-Pad Left -->
  <path d="M140 235 L160 235 L160 215 L180 215 L180 235 L200 235 L200 255 L180 255 L180 275 L160 275 L160 255 L140 255 Z" fill="#00F0FF" />

  <!-- Action Buttons Right -->
  <circle cx="340" cy="225" r="10" fill="#F43F5E" />
  <circle cx="365" cy="245" r="10" fill="#34D399" />
  <circle cx="315" cy="245" r="10" fill="#38BDF8" />
  <circle cx="340" cy="265" r="10" fill="#FBBF24" />

  <!-- Center Lightning Bolt (Instant Delivery) -->
  <path d="M265 140 L235 230 L265 230 L245 315 L285 220 L255 220 Z" 
        fill="#FACC15" 
        stroke="#CA8A04" 
        stroke-width="2" 
        filter="url(#glow)" />
</svg>
